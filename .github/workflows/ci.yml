name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for containers (dev-safe)
        # backend/.env.example is production-flavoured: its DB host does not
        # exist in CI, and main.py performs a schema check against the
        # configured database at import time — with the example file the web
        # container crash-loops and `import main` fails anywhere else too.
        # Generate an env that matches docker-compose.yml's MySQL service and
        # keeps ENVIRONMENT=development so the readiness assert is skipped.
        run: |
          cat > backend/.env <<'EOF'
          ENVIRONMENT=development
          DEBUG=false
          APP_RELOAD=false
          DB_DRIVER=mysql+pymysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_USER=appuser
          DB_PASSWORD=change-me-now
          DB_NAME=asiatech_sentiment_db
          SECRET_KEY=ci-only-secret-key-not-for-production-123456
          CORS_ORIGINS=http://localhost:8000
          FRONTEND_URL=http://localhost:8000
          EOF

      - name: Create MiniLM stubs for the readiness check
        # The real MiniLM artifacts live in a PRIVATE Hugging Face repo and are
        # pulled at startup via HF_TOKEN (services/hub_downloader.py). CI has no
        # token, so /ready would report models:degraded and
        # test_readiness_endpoint_reports_database_and_model_state fails
        # ("models" != "ready"). That check - and every model test - only
        # verifies EXISTENCE of these two files (tokenizer/ONNX session are
        # faked in tests), so empty stubs satisfy them without committing any
        # model bytes to the repo.
        run: |
          mkdir -p backend/app/ml/minilm_sentiment
          : > backend/app/ml/minilm_sentiment/config.json
          : > backend/app/ml/minilm_sentiment/model.onnx

      - name: Build web image
        run: docker compose build web

      - name: Start containers
        run: docker compose up -d

      - name: Wait for MySQL to be healthy
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' student-sentiment-analysis-system-mysql-1 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              break
            fi
            echo "Waiting for MySQL... ($status)"
            sleep 5
          done

      - name: Set up Python for tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies (runner-level)
        # Runs pytest on the runner, not inside the web container: the
        # container already runs 2 gunicorn workers importing the full ML
        # stack (onnxruntime/sklearn/pandas), and the previous exec-based
        # pytest step was SIGKILLed (exit 137) within seconds — the exec
        # attached to a container that was dying, not an OOM of pytest itself.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend test suite
        # Hermetic: sqlite via DB_DRIVER=sqlite (conftest already uses
        # in-memory sqlite). No MySQL needed for the test suite; the compose
        # services above serve as the container/boot smoke test.
        working-directory: backend
        env:
          ENVIRONMENT: development
          DEBUG: "false"
          DB_DRIVER: sqlite
          SECRET_KEY: ci-only-secret-key-not-for-production-123456
          CORS_ORIGINS: http://localhost:8000
          FRONTEND_URL: http://localhost:8000
        run: python -m pytest -q

      - name: Show running containers
        run: docker compose ps

      - name: Show web container logs
        if: always()
        run: docker compose logs web

      - name: Tear down
        if: always()
        run: docker compose down
